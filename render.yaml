# Render Blueprint (https://render.com/docs/blueprint-spec): a free web service built from
# ./Dockerfile and a free PostgreSQL database. See "Deploying to Render" in the README.
databases:
  - name: movies-on-rails-db
    plan: free
    databaseName: movies_on_rails
    user: movies_on_rails
    postgresMajorVersion: "16"

services:
  - type: web
    name: movies-on-rails
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movies-on-rails-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SEED_DEMO_USER
        value: "true"
      # One Puma process (no cluster) fits the free instance's 512 MB best.
      - key: WEB_CONCURRENCY
        value: "0"
      # Optional password-protected email inbox at /letter_opener (both values required).
      - key: MAIL_INBOX_USERNAME
        value: dev
      - key: MAIL_INBOX_PASSWORD
        sync: false
