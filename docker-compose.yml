# Local development and test environment: `docker compose up`
# Optional overrides (all have defaults): POSTGRES_PASSWORD, APP_PORT - see .env.example
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               (bundle check || bundle install) &&
               bin/rails db:prepare &&
               bin/rails server -b 0.0.0.0"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432
      RAILS_ENV: development
      APP_HOST: localhost:${APP_PORT:-3000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000" # reachable from this machine only
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
